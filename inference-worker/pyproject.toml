[project]
name = "inference-worker"
version = "0.1.0"
description = "Football video inference worker: ingestion, detection, tracking, pitch mapping and event publishing."
requires-python = ">=3.12"
dependencies = [
  "football-events",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Real computer vision. Installed in the GPU image (and optionally locally).
real = [
  "opencv-python-headless>=4.9",
  "ultralytics>=8.3",
  "catboost>=1.2",  # tennis bounce classifier (optional weights)
  "rapidocr>=3.4",  # broadcast scoreboard OCR to confirm goals (Apache-2.0)
  "onnxruntime>=1.18",
  "nvidia-ml-py>=12.535",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
