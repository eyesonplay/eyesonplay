# Production: one HTTPS origin served by Caddy (automatic certificates); the
# API and dashboard are not exposed directly; nightly database backups.
#
#   cp .env.example .env   # set DOMAIN, ADMIN_EMAIL, ADMIN_PASSWORD, POSTGRES_PASSWORD
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.prod.yml up -d --build
#
# See docs/deployment.md.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  api:
    ports: !reset []
    environment:
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # Only Caddy reaches the API, so its X-Forwarded-For (the client's IP,
      # used for login rate limits) can be trusted.
      FORWARDED_ALLOW_IPS: "*"
      API_DOCS: "false"

  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_API_URL: same-origin

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-football}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-football}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/deploy/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/deploy/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
