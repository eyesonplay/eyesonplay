version: 2
updates:
  - package-ecosystem: pip
    directories: [/backend, /event-engine, /inference-worker]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      website: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /frontend, /inference-worker]
    schedule: { interval: weekly }
    ignore:
      # The CUDA major version must move together with the PyTorch wheels
      # (inference-worker/Dockerfile) and the drivers on GPU hosts.
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major"]
