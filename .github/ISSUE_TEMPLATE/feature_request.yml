name: Feature request
description: Suggest an event, sport or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Can it be measured from the video?
      description: EyesOnPlay never invents data. Say which signal in the video makes this detectable.
