name: Release

# Push a version tag (e.g. v0.1.0) to publish Docker images to GitHub Container
# Registry and create the GitHub release with that version's CHANGELOG notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
            target: ""
            platforms: linux/amd64,linux/arm64
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
            target: ""
            platforms: linux/amd64,linux/arm64
          - name: worker
            context: .
            file: inference-worker/Dockerfile
            target: cpu
            platforms: linux/amd64
          - name: worker-real
            context: .
            file: inference-worker/Dockerfile
            target: real-cpu
            platforms: linux/amd64
          - name: worker-gpu
            context: .
            file: inference-worker/Dockerfile
            target: gpu
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the CUDA image
        if: matrix.name == 'worker-gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/eyesonplay-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          # The published dashboard expects the API on its own origin (reverse proxy).
          build-args: |
            NEXT_PUBLIC_API_URL=same-origin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" >&2; exit 1; fi
          cat >> notes.md <<NOTES

          ### Docker images

          \`\`\`
          ghcr.io/${{ github.repository_owner }}/eyesonplay-api:$version
          ghcr.io/${{ github.repository_owner }}/eyesonplay-frontend:$version
          ghcr.io/${{ github.repository_owner }}/eyesonplay-worker-gpu:$version
          \`\`\`

          Deploy with [docs/deployment.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/deployment.md).
          NOTES
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "EyesOnPlay $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
