[project]
name = "football-api"
version = "0.1.0"
description = "REST + WebSocket API for EyesOnPlay, real-time sports video analysis."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.3",
  "asyncpg>=0.31.0",
  "alembic>=1.20.0",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "redis>=8.1.0",
  "structlog>=26.1.0",
  "python-multipart>=0.0.32",
  "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "httpx>=0.28.1",
  "fakeredis>=2.39.0",
  "aiosqlite>=0.22.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
